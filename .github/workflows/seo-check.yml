name: SEO checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  seo-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run SEO checks
        run: python scripts/seo_check.py

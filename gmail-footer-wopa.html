<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

    </tr>
    <tr>
      <td style="padding:0;">
        <table cellpadding="0" cellspacing="0" role="presentation" style="border-collapse:collapse;">
          <tr>
            <td style="padding:0 14px 0 0; vertical-align:middle;">
              <a href="https://mywopa.com/" style="text-decoration:none;">
                <img src="https://mywopa.com/wopa-rectangular-icon-320x132.png" width="160" height="66" alt="WOPA" style="display:block; border:0; outline:none; text-decoration:none; width:160px; height:66px;">

            </td>
            <td style="padding:0 0 0 14px; vertical-align:middle; border-left:2px solid #E8A33A;">
              <div style="font-size:17px; line-height:21px; font-weight:700; color:#0B6B4D; letter-spacing:0;">
                WOPA
              </div>
              <div style="font-size:13px; line-height:18px; color:#14201B; font-weight:600;">

              </div>

                <span style="color:#B0A898;">&nbsp;|&nbsp;</span>
                <a href="mailto:hello@mywopa.com" style="color:#0B6B4D; text-decoration:none; font-weight:700;">hello@mywopa.com</a>
              </div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
